name: Update changelog index

on:
  push:
    branches: [Website]
    paths: ["Changelogs/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/changelogs.py
      - name: Commit index and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update changelog index"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
