# ============================================================
# XtoXray - Single JAR Multi-Version Properties
# ============================================================
# Compiled against MC 26.2 (highest target).
# Uses reflection for cross-version compat (26.1, 26.1.1, 26.1.2,
# and 1.21.11).
# Bytecode targets Java 21 so the JAR runs on Java 21 (MC 1.21.11)
# AND Java 25 (MC 26.x).
# Gradle itself runs on Java 25 (via org.gradle.java.home) so
# Loom dependency resolution accepts ModMenu 20.0.1 (needs Java 25).
# ============================================================

minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
mod_version=2026.25
maven_group=com.xtoxray
archives_base_name=xtoxray

# Java
# java_version is used for sourceCompatibility/targetCompatibility (Loom dep resolution).
# options.release in build.gradle overrides bytecode to Java 21.
java_version=25

# Force Gradle to use Java 25 so Loom resolves dependencies correctly.
# On Windows this points to the JDK 25 installation.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-25.0.3

# Fabric API - Version for 26.2 (compiled target)
fabric_api_version=0.154.2+26.2

# Loom
loom_version=1.17.13

# Mod Menu
modmenu_version=20.0.1
