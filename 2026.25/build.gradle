// ============================================================
// XtoXray - Single JAR Multi-Version Build
// ============================================================
// Compiled against MC 26.1 (lowest target).
// Works on 26.1, 26.1.1, 26.1.2, and 26.2.
//
// Build:  ./gradlew build
// Clean:  ./gradlew clean
// ============================================================

plugins {
    id "net.fabricmc.fabric-loom" version "1.17.13"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // ModMenu as local JAR — avoids Gradle dependency resolution Java version check
    compileOnly files('libs/modmenu-20.0.1.jar')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
        expand "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Force Java 21 bytecode so the JAR runs on both Java 21 (MC 1.21.11) and Java 25 (MC 26.x).
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes(
            "XtoXray-Supported-Versions": "26.1,26.1.1,26.1.2,26.2",
            "XtoXray-Mod-Version": project.mod_version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
