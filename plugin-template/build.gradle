plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'

dependencies {
    // Copy xtoxray-<version>-api.jar from the XtoXray build into libs/
    compileOnly fileTree(dir: 'libs', include: '*-api.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
